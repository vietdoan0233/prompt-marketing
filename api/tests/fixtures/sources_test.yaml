# Mergero source registry — reviewed configuration.
# Only sources with permission_status: approved AND enabled: true can ingest. Everything else fails closed.
# approval_reference is a placeholder for the legal/licence review ticket; replace with the real reference.

regions:
  nordics:
    countries: [FI, SE, "NO", DK, IS]
    source_modes: [public-approved, mergero-supplied, licensed]
    default_language: en
  dach:
    countries: [DE, AT, CH]
    source_modes: [public-approved, mergero-supplied, licensed]
    default_language: de

_company_fields: &company_fields
  [legal_name, trading_name, city, region, registry_id, vat_id, website, industry_code, sector, employees]

sources:
  # ---------------------------------------------------------------- Nordics: official registries
  - id: fi-prh-ytj
    name: PRH / YTJ open data (Finnish Trade Register)
    provider: Finnish Patent and Registration Office (PRH)
    region: nordics
    countries: [FI]
    source_type: registry
    source_mode: public-approved
    terms_url: https://avoindata.prh.fi/en
    permission_status: approved
    approval_reference: DEMO-APPROVAL-FI-PRH
    connector_type: prh
    connector_config: {fixture: registry/prh_companies.json, live: false}
    enabled: true
    allowed_fields: [legal_name, trading_name, city, registry_id, website, industry_code, sector]
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    rate_limit_per_minute: 60
    trust_rank: 10
    notes: Open data (CC BY 4.0). No headcount field; qualification needs another approved source.

  - id: no-brreg
    name: Brønnøysund Enhetsregisteret
    provider: Brønnøysundregistrene
    region: nordics
    countries: ["NO"]
    source_type: registry
    source_mode: public-approved
    terms_url: https://data.brreg.no/enhetsregisteret/api/dokumentasjon/no/index.html
    permission_status: approved
    approval_reference: DEMO-APPROVAL-NO-BRREG
    connector_type: brreg
    connector_config: {fixture: registry/brreg_enheter.json, live: false}
    enabled: true
    allowed_fields: [legal_name, city, registry_id, vat_id, website, industry_code, sector, employees]
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    rate_limit_per_minute: 60
    trust_rank: 10
    notes: Open API (NLOD). Supports fraAntallAnsatte so discovery can filter >= 20 employees at source.

  - id: se-bolagsverket-allabolag
    name: Allabolag / Bolagsverket export
    provider: Allabolag (Bolagsverket filings)
    region: nordics
    countries: [SE]
    source_type: registry
    source_mode: licensed
    terms_url: https://www.allabolag.se/
    permission_status: approved
    approval_reference: DEMO-LICENCE-SE-ALLABOLAG
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, city, registry_id, vat_id, website, industry_code, sector, employees, revenue, currency, contacts]
    field_mapping:
      Organisationsnummer: registry_id
      Företagsnamn: legal_name
      Ort: city
      SNI-kod: industry_code
      Bransch: sector
      Anställda: employees
      Omsättning (SEK): revenue
      Valuta: currency
      Hemsida: website
      Land: country
      VD: contact_name
      Roll: contact_role
      Källa-URL: source_url
      Hämtad: observed_at
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 14
    trust_rank: 20
    notes: Licensed export. Board/CEO names are public-business personal data (contacts allowed, no emails supplied).

  - id: dk-cvr
    name: CVR / Virk data distribution
    provider: Erhvervsstyrelsen (Danish Business Authority)
    region: nordics
    countries: [DK]
    source_type: registry
    source_mode: public-approved
    terms_url: https://datacvr.virk.dk/artikel/system-til-system-adgang-til-cvr-data
    permission_status: approved
    approval_reference: DEMO-APPROVAL-DK-CVR
    connector_type: csv
    enabled: false
    allowed_fields: *company_fields
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 10
    notes: Approved but connector disabled until system-to-system credentials are issued (blocker). Fails closed.

  # ---------------------------------------------------------------- DACH: official registries
  - id: de-handelsregister
    name: Handelsregister / Unternehmensregister export
    provider: Gemeinsames Registerportal der Länder
    region: dach
    countries: [DE]
    source_type: registry
    source_mode: public-approved
    terms_url: https://www.handelsregister.de/
    permission_status: approved
    approval_reference: DEMO-APPROVAL-DE-HR
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, city, registry_id, vat_id, website, industry_code, sector, employees, contacts]
    field_mapping:
      Firma: legal_name
      Sitz: city
      Registernummer: registry_id
      USt-IdNr: vat_id
      Webseite: website
      WZ-Code: industry_code
      Branche: sector
      Mitarbeiter: employees
      Land: country
      Geschäftsführer: contact_name
      Funktion: contact_role
      Quelle: source_url
      Abgerufen: observed_at
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 10
    notes: Managing directors (Geschäftsführer) are published register data; stored as public-business contacts.

  - id: at-firmenbuch
    name: Firmenbuch / FirmenABC export
    provider: Republik Österreich Firmenbuch (via FirmenABC)
    region: dach
    countries: [AT]
    source_type: registry
    source_mode: public-approved
    terms_url: https://www.firmenabc.at/
    permission_status: approved
    approval_reference: DEMO-APPROVAL-AT-FB
    connector_type: csv
    enabled: true
    allowed_fields: *company_fields
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 10

  - id: ch-zefix
    name: Zefix central business name index
    provider: Federal Office of Justice (FOJ)
    region: dach
    countries: [CH]
    source_type: registry
    source_mode: public-approved
    terms_url: https://www.zefix.admin.ch/
    permission_status: approved
    approval_reference: DEMO-APPROVAL-CH-ZEFIX
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, city, registry_id, vat_id, website, industry_code, sector]
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 10

  - id: de-northdata
    name: North Data
    provider: North Data GmbH
    region: dach
    countries: [DE, AT, CH]
    source_type: licensed_feed
    source_mode: licensed
    terms_url: https://www.northdata.com/
    permission_status: pending
    connector_type: csv
    enabled: false
    allowed_fields: *company_fields
    base_confidence: verified
    usage_policy: restricted
    retention_days: 30
    trust_rank: 20
    notes: Licence under negotiation (blocker). Imports are rejected until approved.

  - id: ch-moneyhouse
    name: Moneyhouse
    provider: Moneyhouse AG
    region: dach
    countries: [CH]
    source_type: licensed_feed
    source_mode: licensed
    terms_url: https://www.moneyhouse.ch/
    permission_status: pending
    connector_type: csv
    enabled: false
    allowed_fields: *company_fields
    base_confidence: verified
    usage_policy: restricted
    retention_days: 30
    trust_rank: 20

  # ---------------------------------------------------------------- Domain-level + firmographics
  - id: web-impressum
    name: Company website Impressum extraction
    provider: Mergero (approved extraction of legally mandated imprint pages)
    region: dach
    countries: [DE, AT, CH]
    source_type: website
    source_mode: public-approved
    terms_url: https://www.gesetze-im-internet.de/ddg/__5.html
    permission_status: approved
    approval_reference: DEMO-APPROVAL-IMPRESSUM
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, city, registry_id, vat_id, website, contacts]
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 14
    trust_rank: 25
    notes: /impressum pages give legal entity, register court/ID, VAT ID and managing directors (§5 DDG).

  - id: licensed-firmographics
    name: Licensed B2B firmographic feed
    provider: Approved B2B data provider (licence on file)
    region: internal
    countries: [FI, SE, "NO", DK, IS, DE, AT, CH]
    source_type: licensed_feed
    source_mode: licensed
    permission_status: approved
    approval_reference: DEMO-LICENCE-FIRMOGRAPHICS
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, registry_id, vat_id, website, sector, employees, city]
    base_confidence: estimated
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 30
    notes: Headcount estimates (LinkedIn-derived via licensed provider). Estimated until confirmed by a registry.

  - id: mergero-csv
    name: Mergero-supplied CSV
    provider: Mergero
    region: internal
    countries: [FI, SE, "NO", DK, IS, DE, AT, CH]
    source_type: mergero_csv
    source_mode: mergero-supplied
    permission_status: approved
    approval_reference: MERGERO-INTERNAL
    connector_type: csv
    enabled: true
    allowed_fields: [legal_name, trading_name, city, region, registry_id, vat_id, website, industry_code, sector, employees, revenue, currency, ownership_type, description, contacts]
    base_confidence: estimated
    usage_policy: internal-only
    retention_days: 30
    trust_rank: 40
    notes: Mergero's enriched lists; known to be incomplete or partly outdated, so facts start as estimated.

  # ---------------------------------------------------------------- Not approved: always fail closed
  - id: linkedin-scrape
    name: LinkedIn page scraping
    provider: LinkedIn (unlicensed scraping)
    region: internal
    countries: [FI, SE, "NO", DK, IS, DE, AT, CH]
    source_type: website
    source_mode: public-approved
    terms_url: https://www.linkedin.com/legal/user-agreement
    permission_status: unapproved
    connector_type: csv
    enabled: false
    allowed_fields: []
    base_confidence: estimated
    usage_policy: prohibited
    retention_days: 0
    trust_rank: 90
    notes: Scraping violates the LinkedIn User Agreement. Use licensed-firmographics instead.

  # ---------------------------------------------------------------- System source for manual corrections
  - id: mergero-manual
    name: Manual correction (Mergero reviewer)
    provider: Mergero
    region: internal
    countries: [FI, SE, "NO", DK, IS, DE, AT, CH]
    source_type: manual
    source_mode: mergero-supplied
    permission_status: approved
    approval_reference: MERGERO-INTERNAL
    connector_type: manual
    enabled: true
    allowed_fields: [legal_name, trading_name, city, website, industry_code, sector, employees, revenue, ownership_type, description]
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 365
    trust_rank: 0
    notes: Not ingestible. Holds reviewer corrections; original source facts are preserved.
