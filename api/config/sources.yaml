# Mergero source registry — Estonia-only production catalog.
#
# The official register files are public-approved bulk data. Current share capital and current
# shareholders (osanikud) are in scope; the beneficial-owner (kasusaajad) file is not, and the
# official register's own national ID code, its hash, birth date and home address for a person
# shareholder are never read by the importer regardless of catalog configuration.

regions:
  baltics:
    countries: [EE]
    source_modes: [public-approved, mergero-supplied]
    default_language: et

sources:
  - id: ee-ariregister
    tier: A
    name: Estonian e-Business Register open data
    provider: Registrite ja Infosüsteemide Keskus (RIK)
    region: baltics
    countries: [EE]
    source_type: registry
    source_mode: public-approved
    terms_url: https://avaandmed.ariregister.rik.ee/et/avaandmete-allalaadimine
    permission_status: approved
    approval_reference: Estonia national open-data licence guide (portal terms)
    connector_type: ee_ariregister
    connector_config: {live: true}
    enabled: true
    allowed_fields:
      [
        legal_name, registry_id, vat_id, city, registry_status, industry_code, employees,
        share_capital, currency, website, email_domain, registry_domains,
      ]
    field_mapping: {}
    base_confidence: verified
    usage_policy: internal-only
    retention_days: 30
    rate_limit_per_minute: 30
    trust_rank: 10
    notes: >-
      Official basic-data, annual-report, EMTAK, general-data and shareholder bulk files. Only OÜ, AS, UÜ,
      TÜ, TÜH and SE entities are eligible. The beneficial-owner (kasusaajad) file is not used. The source
      supplies registered addresses, share capital, current shareholders and reported financial lines. A
      person shareholder is stored by name and holding only; the file's national ID code, its hash, birth
      date and home address are never read into the importer. The general-data file is also used for
      company-declared website and email *domains* (active WWW/EMAIL entries) for the digital-decay signal;
      phone numbers and mailbox local-parts are never read.

  - id: web-digital-decay
    tier: C
    name: Company website activity check (Digital Decay)
    provider: Company-published websites (domain verified against the official register)
    region: baltics
    countries: [EE]
    source_type: website
    source_mode: public-approved
    terms_url: null
    permission_status: approved
    approval_reference: Opt-in Digital Decay signal; evidence-only, robots.txt respected (see ARCHITECTURE.md)
    connector_type: website_decay
    connector_config: {live: true}
    enabled: false
    # registry_id is the match key only (enrichment rows never store it as a fact); see build_record.
    allowed_fields: [registry_id, website, footer_copyright_year, latest_news_date, open_positions, digital_decay_signal]
    field_mapping: {}
    base_confidence: estimated
    usage_policy: internal-only
    retention_days: 14
    rate_limit_per_minute: 20
    trust_rank: 40
    notes: >-
      Opt-in and disabled by default. Enrichment only: it can never create a company. Reads a
      company's own website (home, sitemap, news and careers pages; max 8 pages; robots.txt respected)
      only after the domain is verified by registry code or legal name + registered address. Stores
      extracted evidence (years, dates, job-link counts, URLs), never raw HTML or contact data. No
      LinkedIn or social networks.

  - id: mergero-manual
    tier: I
    name: Mergero manual Estonia input
    provider: Mergero
    region: baltics
    countries: [EE]
    source_type: mergero_csv
    source_mode: mergero-supplied
    permission_status: pending
    approval_reference: Mergero internal data supply
    connector_type: csv
    connector_config: {live: false}
    enabled: false
    allowed_fields: [legal_name, registry_id, vat_id, city, industry_code, employees]
    field_mapping: {}
    base_confidence: estimated
    usage_policy: internal-only
    retention_days: 30
    rate_limit_per_minute: null
    trust_rank: 50
    notes: Disabled in the official-source-only Estonia deployment; corrections remain available through the review API.
