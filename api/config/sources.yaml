# Mergero source registry — production catalog (A = official/public/API, L = licensed/commercial, C = company website).
#
# Only sources with permission_status: approved AND enabled: true can ingest; everything else fails closed.
# Access status verified 2026-09-26 from the development environment:
#   live + credential-free : NO Brreg, FI PRH (v3). Company websites (robots.txt respected).
#   needs free credentials : CH Zefix PublicREST (HTTP 401), DK CVR distribution (HTTP 401), SE Bolagsverket API (OAuth).
#   no API / restricted    : DE Handelsregister & Unternehmensregister (no API; robots disallow search), AT Firmenbuch
#                            (paid extracts), IS Skatturinn (no open API), Virre (paid extracts).
#   L sources              : need a licence/API contract before they can be approved.
# Quote "NO" (Norway) — unquoted it parses as boolean false and the loader rejects it.

regions:
  nordics:
    countries: [FI, SE, "NO", DK, IS]
    source_modes: [public-approved, mergero-supplied, licensed]
    default_language: en
  dach:
    countries: [DE, AT, CH]
    source_modes: [public-approved, mergero-supplied, licensed]
    default_language: de

_registry_fields: &registry_fields [legal_name, trading_name, city, registry_id, vat_id, website, industry_code, sector, employees]
_licensed_fields: &licensed_fields [legal_name, city, registry_id, vat_id, website, industry_code, sector, employees, revenue, currency]
_web_fields: &web_fields [legal_name, registry_id, vat_id, website, open_positions, founder_signal, family_business_signal]

